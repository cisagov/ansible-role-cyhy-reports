---
# Whether or not to create and enable a systemd timer to automatically
# generate CyHy reports on a schedule.  See also
# cyhy_reports_schedule.
cyhy_reports_automation: false

# The schedule according to which CyHy reporting is to be run.  The
# format is described in the systemd.time man page.
cyhy_reports_schedule: Mon 05:00:00

# This mirrors the defaults in cisagov/ansible-role-cyhy-core and
# cisagov/ansible-role-geoip2
cyhy_reports_install_geoipupdate: false

# The version of cisagov/cyhy-reports to use; must be a valid git reference
cyhy_reports_version: v1.1.0
